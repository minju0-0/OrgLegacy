{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>{% block title %}OrgLegacy{% endblock %}</title>

    <!-- Google Fonts: Tinos (institutional serif) & IBM Plex Mono (literal data only) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        warm: {
                            espresso: '#1c1917',
                            'espresso-dark': '#141210',
                            vellum: '#faf8f5',
                            'vellum-tint': '#f5f1ea',
                            linen: '#e4dcd2',
                            'linen-dark': '#d3c7b9',
                            walnut: '#785135',
                            'walnut-light': '#936746',
                            charcoal: '#57534e',
                            crimson: '#852221',
                            'crimson-dark': '#6b1b1a',
                            moss: '#2d4a34',
                            ink: '#1c1917',
                        }
                    },
                    fontFamily: {
                        serif: ['Tinos', 'Times New Roman', 'Times', 'Georgia', 'serif'],
                        sans: ['Tinos', 'Times New Roman', 'Times', 'Georgia', 'serif'],
                        mono: ['IBM Plex Mono', 'Menlo', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Shared design tokens, reset, and component styles (used by every feature) -->
    <link rel="stylesheet" href="{% static 'css/shared/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-warm-vellum text-warm-espresso font-sans h-screen flex flex-col overflow-hidden antialiased">
    {% block content %}{% endblock %}

    <!-- Global Toast Container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- Shared behavior: auth slide transition + toast helper -->
    <script src="{% static 'js/shared/base.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
