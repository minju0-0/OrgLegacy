<div class="auth__top">
  <a href="{% url 'landing' %}" class="wordmark" aria-label="orglegacy"><span class="wordmark__o" aria-hidden="true"></span>rglegacy</a>
  <span class="auth__badge">{{ badge }}</span>
</div>
<div class="auth__copy">
  <div class="shelf auth__shelf" role="img" aria-label="Four volumes on a shelf, the newest standing out">
    <div class="spine spine--kraft" style="--h:120px">A.Y. 2023–24</div>
    <div class="spine spine--blush" style="--h:140px">A.Y. 2024–25</div>
    <div class="spine spine--paper" style="--h:128px">A.Y. 2025–26</div>
    <div class="spine spine--crimson spine--new" style="--h:150px">A.Y. 2026–27</div>
  </div>
  <div>
    <p class="auth__quote">{{ quote }}</p>
    <p class="auth__sub">{{ sub }}</p>
  </div>
</div>
