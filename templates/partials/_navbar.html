<!-- Global top bar: brand + identity ONLY. Page navigation (Home,
     Profile, Settings) and Log Out now live in partials/_sidebar.html,
     so they are intentionally not duplicated here. -->
<nav class="w-full flex items-center justify-between px-7 h-[60px] bg-warm-espresso border-b border-warm-espresso-dark flex-shrink-0">
    <div class="flex items-center gap-3">
        <span class="bg-warm-vellum text-warm-espresso w-[34px] h-[34px] rounded-lg flex items-center justify-center font-serif font-semibold text-sm">OL</span>
        <div class="leading-none">
            <span class="font-serif font-semibold text-base text-warm-vellum block">OrgLegacy</span>
            <span class="text-[10px] uppercase tracking-widest text-warm-vellum/55">Institutional Archive</span>
        </div>
    </div>

    <div class="flex items-center gap-3">
        <div class="text-right leading-tight hidden sm:block">
            <span class="text-sm text-warm-vellum block">{{ request.user.get_full_name|default:request.user.username }}</span>
            <span class="text-[11px] italic text-warm-vellum/50">{{ request.user.username }}</span>
        </div>
        <span class="avatar-chip avatar-chip--topbar" title="{{ request.user.username }}">{{ request.user.username|first|upper }}</span>
    </div>
</nav>
