<!-- Persistent left sidebar: account identity + primary navigation +
     logout. This is where Home / Profile / Settings / Log Out live now,
     removed from the top bar (see partials/_navbar.html). -->
<aside class="sidebar flex-shrink-0 flex flex-col">
    <div class="sidebar-profile">
        <span class="avatar-chip" title="{{ request.user.username }}">{{ request.user.username|first|upper }}</span>
        <div class="min-w-0">
            <div class="sidebar-profile-name">{{ request.user.get_full_name|default:request.user.username }}</div>
            <div class="sidebar-profile-handle">@{{ request.user.username }}</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <a href="{% url 'home:home' %}" class="sidebar-link {% if active_page == 'home' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
            <span>Home</span>
        </a>
        <a href="{% url 'profile:profile' %}" class="sidebar-link {% if active_page == 'profile' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1-3.5 4-5.5 7-5.5s6 2 7 5.5"/></svg>
            <span>Profile</span>
        </a>
        <a href="{% url 'settings:settings' %}" class="sidebar-link {% if active_page == 'settings' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V19a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H4a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 5.6 8.4a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H10a1.65 1.65 0 0 0 1-1.51V2a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V8.6c.14.62.62 1.13 1.51 1.4H22a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <form method="post" action="{% url 'login:logout' %}" class="m-0 p-0">
            {% csrf_token %}
            <button type="submit" class="sidebar-logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Log Out</span>
            </button>
        </form>
    </div>
</aside>
