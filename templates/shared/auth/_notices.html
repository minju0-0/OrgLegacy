{% comment %}Django messages render as toasts (shared/ui/_messages.html). Only form-level errors show here.{% endcomment %}
{% if form.non_field_errors %}
<div class="notice" role="alert">
  {% include "shared/ui/_icon.html" with name="warning-circle" %}
  <div>{{ form.non_field_errors }}</div>
</div>
{% endif %}
