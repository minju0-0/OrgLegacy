{% comment %}Term status stamp. Pass status="ACTIVE" | "PENDING_SIGNOFF" | "CLOSED". Optional class="stamp--lg".{% endcomment %}{% if status == "ACTIVE" %}<span class="stamp {{ class }}">Active</span>{% elif status == "PENDING_SIGNOFF" %}<span class="stamp stamp--pending {{ class }}">Awaiting approval</span>{% else %}<span class="stamp stamp--sealed {{ class }}">Closed</span>{% endif %}
